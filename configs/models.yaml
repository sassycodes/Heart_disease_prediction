# configs/models.yaml
# Hyperparameter search spaces for models

models:
  lr:
    # Logistic Regression grid
    # C is the inverse of regularization strength.
    C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
    # Note: class_weight=None is hardcoded in registry.

  rf:
    # Random Forest randomized search space
    max_depth: [2, 3, 4, 5, 6, 7, 8]
    min_samples_leaf: [2, 3, 4, 5, 6, 8, 10]
    n_estimators: [200, 300, 400, 500]
    # Note: class_weight=None is hardcoded in registry.

  xgb:
    # XGBoost randomized search space
    max_depth: [2, 3, 4]
    learning_rate: [0.02, 0.05, 0.1, 0.15]
    n_estimators: [100, 200, 300, 400, 500]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]
    min_child_weight: [1, 2, 3, 4, 5]
    reg_lambda: [0.1, 1.0, 5.0, 10.0, 50.0]
    # Note: scale_pos_weight=1 is hardcoded in registry.
